[project]
site_name = "考研数学一知识体系"
site_description = "可持续迭代的考研数学一知识树、公式卡、母题索引、反例库与错题闭环。"
site_author = "考研数学一知识体系贡献者"
copyright = "Copyright &copy; 2026 考研数学一知识体系贡献者"
docs_dir = "docs"
site_dir = "site"

site_url = "https://a1649153754-sketch.github.io/kaoyan-math1-knowledge-system/"
repo_url = "https://github.com/a1649153754-sketch/kaoyan-math1-knowledge-system"
repo_name = "a1649153754-sketch/kaoyan-math1-knowledge-system"
edit_uri = "edit/main/docs/"

extra_css = ["assets/stylesheets/extra.css"]

nav = [
  { "首页" = "index.md" },
  { "体系总览" = "00-overview.md" },
  { "核心知识框架" = [
    { "高等数学" = "01-calculus.md" },
    { "线性代数" = "02-linear-algebra.md" },
    { "概率论与数理统计" = "03-probability-statistics.md" },
    { "跨模块方法库" = "04-method-library.md" },
  ] },
  { "复习与维护" = [
    { "复习闭环" = "05-maintenance-loop.md" },
    { "三级检查清单" = "06-checklists.md" },
    { "核心定理条件" = "07-theorem-index.md" },
    { "题型决策树" = "08-decision-trees.md" },
    { "可打印记录模板" = "09-review-templates.md" },
  ] },
  { "速查与索引" = [
    { "公式与结论速查" = "10-formula-cards.md" },
    { "典型真题母题" = "11-problem-archetypes.md" },
    { "反例与失效边界" = "12-counterexamples.md" },
  ] },
  { "个性化与项目" = [
    { "个人疑问挂接" = "13-personal-links.md" },
    { "项目维护指南" = "14-project-maintenance.md" },
    { "本地掌握图谱" = "15-local-data.md" },
  ] },
]

[project.theme]
language = "zh"
features = [
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统外观"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
