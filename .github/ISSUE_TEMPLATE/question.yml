name: 讨论题目或疑问
about: 讨论一道题应挂到哪个节点，或某个条件为何必要
title: "[讨论] "
labels:
  - discussion
body:
  - type: textarea
    id: question
    attributes:
      label: 问题描述
      description: 请尽量用自己的话概括题目，不要上传未经授权的整套试卷。
    validations:
      required: true
  - type: input
    id: candidate
    attributes:
      label: 可能关联的节点或母题
  - type: textarea
    id: attempt
    attributes:
      label: 已尝试的思路
